[project]
name = "phd-paper-method"
version = "1.0.0"
description = "Data release and reproduction scripts for 'Closed-form depth-fusion readout versus parameter-efficient adaptation of speech foundation models for low-resource clinical screening from voice'"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code in tools/ and paper/figs/source/); CC-BY-4.0 (data)" }
authors = [
  { name = "José Manuel Ramírez Sánchez", email = "jmramirez@gts.uvigo.es" },
  { name = "Laura Docío-Fernández" },
  { name = "Carmen García-Mateo" },
]
dependencies = [
  "numpy>=1.19",
  "scipy>=1.5",
  "matplotlib>=3.3",
  "pillow>=8",
]

[tool.uv]
package = false
